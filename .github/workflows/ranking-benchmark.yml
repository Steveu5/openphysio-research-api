name: Ranking benchmark

on:
  pull_request:
    paths:
      - 'src/config/researchSystemVersion.js'
      - 'src/server.js'
      - 'src/routes/research.js'
      - 'src/routes/researchWorkspace.js'
      - 'src/services/supabase.js'
      - 'src/services/workspaceArticleResolver.js'
      - 'src/services/searchResultSnapshot.js'
      - 'src/services/searchHistoryAudit.js'
      - 'src/services/searchHistoryAuditRepository.js'
      - 'src/utils/hash.js'
      - 'src/services/ranking.js'
      - 'src/services/evidenceScoring.js'
      - 'src/services/evidenceLevel.js'
      - 'src/services/preferredGuidelineSearch.js'
      - 'src/services/trustedSources.js'
      - 'src/services/rankingBenchmark.js'
      - 'benchmarks/**'
      - 'test/ranking-benchmark.test.js'
      - 'test/research-system-version.test.js'
      - 'test/search-provenance.test.js'
      - 'test/search-history-audit.test.js'
      - 'test/immutable-search-snapshot.test.js'
      - 'test/research-route-contract.test.js'
      - 'test/workspace-article-resolver.test.js'
      - 'tools/run-ranking-benchmark.js'
      - 'tools/compare-ranking-benchmark.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'src/config/researchSystemVersion.js'
      - 'src/server.js'
      - 'src/routes/research.js'
      - 'src/routes/researchWorkspace.js'
      - 'src/services/supabase.js'
      - 'src/services/workspaceArticleResolver.js'
      - 'src/services/searchResultSnapshot.js'
      - 'src/services/searchHistoryAudit.js'
      - 'src/services/searchHistoryAuditRepository.js'
      - 'src/utils/hash.js'
      - 'src/services/ranking.js'
      - 'src/services/evidenceScoring.js'
      - 'src/services/evidenceLevel.js'
      - 'src/services/preferredGuidelineSearch.js'
      - 'src/services/trustedSources.js'
      - 'src/services/rankingBenchmark.js'
      - 'benchmarks/**'
      - 'test/ranking-benchmark.test.js'
      - 'test/research-system-version.test.js'
      - 'test/search-provenance.test.js'
      - 'test/search-history-audit.test.js'
      - 'test/immutable-search-snapshot.test.js'
      - 'test/research-route-contract.test.js'
      - 'test/workspace-article-resolver.test.js'
      - 'tools/run-ranking-benchmark.js'
      - 'tools/compare-ranking-benchmark.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ranking, version, provenance, snapshot, audit, route, and workspace tests
        run: node --test test/ranking-benchmark.test.js test/research-system-version.test.js test/search-provenance.test.js test/search-history-audit.test.js test/immutable-search-snapshot.test.js test/research-route-contract.test.js test/workspace-article-resolver.test.js

      - name: Run ranking benchmark
        env:
          BENCHMARK_REPORT_PATH: artifacts/ranking-benchmark.json
        run: npm run benchmark:ranking

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-benchmark-report
          path: artifacts/ranking-benchmark.json
          if-no-files-found: ignore
